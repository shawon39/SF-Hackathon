<template>
    <div class="slds-card">
        <div class="slds-card__header slds-grid">
            <header class="slds-media slds-media_center slds-has-flexi-truncate">
                <div class="slds-media__figure">
                    <span class="slds-icon_container slds-icon-utility-calendar" title="Calendar">
                        <lightning-icon icon-name="utility:calendar" alternative-text="Calendar" size="small"></lightning-icon>
                    </span>
                </div>
                <div class="slds-media__body">
                    <h2 class="slds-card__header-title">
                        <span>Resource Availability Calendar</span>
                    </h2>
                </div>
                <div class="slds-no-flex">
                    <lightning-button-icon
                        icon-name="utility:refresh"
                        alternative-text="Refresh"
                        title="Refresh"
                        onclick={handleRefresh}
                        disabled={isLoading}>
                    </lightning-button-icon>
                </div>
            </header>
        </div>
        
        <div class="slds-card__body slds-card__body_inner">
            <!-- Controls Section -->
            <div class="slds-grid slds-gutters slds-m-bottom_medium">
                <div class="slds-col slds-size_1-of-4">
                    <lightning-radio-group 
                        name="resourceType"
                        label="Resource Type"
                        options={resourceTypeOptions}
                        value={resourceType}
                        type="button"
                        onchange={handleResourceTypeChange}>
                    </lightning-radio-group>
                </div>
                <div class="slds-col slds-size_1-of-4">
                    <lightning-radio-group 
                        name="viewType"
                        label="View Type"
                        options={viewTypeOptions}
                        value={viewType}
                        type="button"
                        onchange={handleViewTypeChange}>
                    </lightning-radio-group>
                </div>
                <div class="slds-col slds-size_1-of-4">
                    <lightning-input
                        type="date"
                        name="selectedDate"
                        label="Select Date"
                        value={selectedDate}
                        onchange={handleDateChange}>
                    </lightning-input>
                </div>
            </div>

            <!-- Loading Spinner -->
            <template if:true={isLoading}>
                <div class="slds-text-align_center slds-m-vertical_large">
                    <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
                    <p class="slds-text-body_regular slds-m-top_small">Loading {resourceType} availability for {selectedDateFormatted}...</p>
                </div>
            </template>

            <!-- Calendar/List Content -->
            <template if:false={isLoading}>
                <!-- Date Display Header -->
                <div class="slds-m-bottom_medium">
                    <div class="slds-box slds-theme_shade">
                        <h3 class="slds-text-heading_small">
                            Showing {resourceType} availability for {selectedDateFormatted}
                        </h3>
                    </div>
                </div>

                <template if:true={hasCalendarData}>
                    
                    <!-- Calendar View -->
                    <template if:true={isCalendarView}>
                        <div class="slds-grid slds-gutters slds-wrap">
                            <template for:each={displayResources} for:item="resource">
                                <div key={resource.id} class="slds-col slds-size_1-of-2 slds-large-size_1-of-3 slds-m-bottom_medium">
                                    <div class="slds-card slds-card_boundary">
                                        <div class="slds-card__header">
                                            <header class="slds-media slds-media_center">
                                                <div class="slds-media__figure">
                                                    <span class="slds-icon_container slds-icon-standard-location" if:true={isRoomView}>
                                                        <lightning-icon icon-name="standard:location" size="small"></lightning-icon>
                                                    </span>
                                                    <span class="slds-icon_container slds-icon-utility-connected_apps" if:true={isEquipmentView}>
                                                        <lightning-icon icon-name="utility:connected_apps" size="small"></lightning-icon>
                                                    </span>
                                                </div>
                                                <div class="slds-media__body">
                                                    <h3 class="slds-card__header-title">
                                                        <span class="slds-text-heading_small">{resource.name}</span>
                                                    </h3>
                                                    <p class="slds-text-body_small">{resource.type}</p>
                                                </div>
                                                <div class="slds-no-flex">
                                                    <lightning-badge 
                                                        label={resource.availabilityStatus} 
                                                        variant={resource.availabilityVariant}>
                                                    </lightning-badge>
                                                </div>
                                            </header>
                                        </div>
                                        <div class="slds-card__body slds-card__body_inner">
                                            <!-- Resource Details -->
                                            <div class="slds-m-bottom_small">
                                                <template if:true={isRoomView}>
                                                    <p class="slds-text-body_small">
                                                        <strong>Capacity:</strong> {resource.capacity} people<br/>
                                                        <strong>Details:</strong> {resource.details}
                                                    </p>
                                                    <template if:true={resource.amenities}>
                                                        <div class="slds-m-top_x-small">
                                                            <template for:each={resource.amenities} for:item="amenity">
                                                                <span key={amenity} class="slds-badge slds-badge_lightest slds-m-right_xx-small slds-m-bottom_xx-small">
                                                                    {amenity}
                                                                </span>
                                                            </template>
                                                        </div>
                                                    </template>
                                                </template>
                                                <template if:true={isEquipmentView}>
                                                    <p class="slds-text-body_small">
                                                        <strong>Details:</strong> {resource.details}
                                                    </p>
                                                </template>
                                            </div>
                                            
                                            <!-- Today's Bookings -->
                                            <div class="slds-m-top_small">
                                                <h4 class="slds-text-heading_small slds-m-bottom_x-small">Today's Bookings</h4>
                                                <template if:true={resource.bookings}>
                                                    <template if:false={resource.bookings.length}>
                                                        <p class="slds-text-body_small slds-text-color_weak">No bookings today</p>
                                                    </template>
                                                    <template if:true={resource.bookings.length}>
                                                        <div class="booking-timeline">
                                                            <template for:each={resource.bookings} for:item="booking">
                                                                <div key={booking.id} class="slds-m-bottom_x-small">
                                                                    <div class="slds-box slds-box_xx-small slds-theme_shade booking-item"
                                                                         data-booking-id={booking.id}
                                                                         data-resource-id={resource.id}
                                                                         onclick={handleBookingClick}>
                                                                        <div class="slds-grid slds-grid_align-spread">
                                                                            <div class="slds-col">
                                                                                <p class="slds-text-body_small slds-truncate">
                                                                                    <strong>{booking.startTime} - {booking.endTime}</strong>
                                                                                </p>
                                                                                <p class="slds-text-body_small slds-text-color_weak slds-truncate">
                                                                                    {booking.purpose}
                                                                                </p>
                                                                            </div>
                                                                            <div class="slds-col slds-no-flex">
                                                                                <lightning-badge 
                                                                                    label={booking.status} 
                                                                                    variant={booking.statusVariant}>
                                                                                </lightning-badge>
                                                                            </div>
                                                                        </div>
                                                                    </div>
                                                                </div>
                                                            </template>
                                                        </div>
                                                    </template>
                                                </template>
                                                <template if:false={resource.bookings}>
                                                    <p class="slds-text-body_small slds-text-color_weak">No bookings today</p>
                                                </template>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </template>

                    <!-- List View -->
                    <template if:true={isListView}>
                        <div class="slds-table_edit_container slds-is-relative">
                            <table class="slds-table slds-table_cell-buffer slds-table_bordered">
                                <thead>
                                    <tr class="slds-line-height_reset">
                                        <th class="" scope="col">
                                            <div class="slds-truncate" title="Resource">{resourceType}</div>
                                        </th>
                                        <th class="" scope="col">
                                            <div class="slds-truncate" title="Type">Type</div>
                                        </th>
                                        <template if:true={isRoomView}>
                                            <th class="" scope="col">
                                                <div class="slds-truncate" title="Capacity">Capacity</div>
                                            </th>
                                        </template>
                                        <th class="" scope="col">
                                            <div class="slds-truncate" title="Status">Status</div>
                                        </th>
                                        <th class="" scope="col">
                                            <div class="slds-truncate" title="Current Booking">Current Booking</div>
                                        </th>
                                        <th class="" scope="col">
                                            <div class="slds-truncate" title="Next Booking">Next Booking</div>
                                        </th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <template for:each={displayResources} for:item="resource">
                                        <tr key={resource.id} class="slds-hint-parent">
                                            <td data-label="Resource">
                                                <div class="slds-cell-edit__container">
                                                    <span class="slds-truncate" title={resource.name}>{resource.name}</span>
                                                </div>
                                            </td>
                                            <td data-label="Type">
                                                <div class="slds-cell-edit__container">
                                                    <span class="slds-truncate" title={resource.type}>{resource.type}</span>
                                                </div>
                                            </td>
                                            <template if:true={isRoomView}>
                                                <td data-label="Capacity">
                                                    <div class="slds-cell-edit__container">
                                                        <span class="slds-truncate">{resource.capacity}</span>
                                                    </div>
                                                </td>
                                            </template>
                                            <td data-label="Status">
                                                <div class="slds-cell-edit__container">
                                                    <lightning-badge 
                                                        label={resource.availabilityStatus} 
                                                        variant={resource.availabilityVariant}>
                                                    </lightning-badge>
                                                </div>
                                            </td>
                                            <td data-label="Current Booking">
                                                <div class="slds-cell-edit__container">
                                                    <template if:true={resource.currentBooking}>
                                                        <span class="slds-truncate">
                                                            {resource.currentBooking.purpose} ({resource.currentBooking.startTime} - {resource.currentBooking.endTime})
                                                        </span>
                                                    </template>
                                                    <template if:false={resource.currentBooking}>
                                                        <span class="slds-text-color_weak">None</span>
                                                    </template>
                                                </div>
                                            </td>
                                            <td data-label="Next Booking">
                                                <div class="slds-cell-edit__container">
                                                    <template if:true={resource.nextBooking}>
                                                        <span class="slds-truncate">
                                                            {resource.nextBooking.purpose} ({resource.nextBooking.startTime})
                                                        </span>
                                                    </template>
                                                    <template if:false={resource.nextBooking}>
                                                        <span class="slds-text-color_weak">None</span>
                                                    </template>
                                                </div>
                                            </td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </div>
                    </template>

                </template>
                
                <!-- No Data State -->
                <template if:false={hasCalendarData}>
                    <div class="slds-text-align_center slds-p-vertical_large">
                        <lightning-icon icon-name="utility:info" size="large" class="slds-m-bottom_small"></lightning-icon>
                        <p class="slds-text-heading_small">No {resourceType}s available for {selectedDateFormatted}</p>
                        <p class="slds-text-body_regular">Try selecting a different date or resource type.</p>
                        <div class="slds-m-top_medium">
                            <lightning-button 
                                variant="brand" 
                                label="Refresh Data" 
                                onclick={handleRefresh}
                                icon-name="utility:refresh">
                            </lightning-button>
                        </div>
                        <template if:true={calendarData}>
                            <div class="slds-m-top_small slds-text-body_small slds-text-color_weak">
                                Debug: Calendar data exists but no resources found
                            </div>
                        </template>
                    </div>
                </template>
            </template>
        </div>
    </div>

    <!-- Booking Details Modal -->
    <template if:true={showModal}>
        <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={handleCloseModal}>
                        <lightning-icon icon-name="utility:close" alternative-text="close" size="small"></lightning-icon>
                        <span class="slds-assistive-text">Close</span>
                    </button>
                    <h2 id="modal-heading-01" class="slds-text-heading_medium slds-hyphenate">Booking Details</h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium">
                    <template if:true={selectedBooking}>
                        <div class="slds-form">
                            <div class="slds-form-element slds-form-element_readonly slds-m-bottom_small">
                                <span class="slds-form-element__label">Booking ID</span>
                                <div class="slds-form-element__control">
                                    <span class="slds-form-element__static">{selectedBooking.name}</span>
                                </div>
                            </div>
                            
                            <div class="slds-form-element slds-form-element_readonly slds-m-bottom_small">
                                <span class="slds-form-element__label">{selectedBooking.resourceType}</span>
                                <div class="slds-form-element__control">
                                    <span class="slds-form-element__static">{selectedBooking.resourceName}</span>
                                </div>
                            </div>
                            
                            <div class="slds-grid slds-gutters slds-m-bottom_small">
                                <div class="slds-col slds-size_1-of-2">
                                    <div class="slds-form-element slds-form-element_readonly">
                                        <span class="slds-form-element__label">Start Time</span>
                                        <div class="slds-form-element__control">
                                            <span class="slds-form-element__static">{selectedBooking.startDateTime}</span>
                                        </div>
                                    </div>
                                </div>
                                <div class="slds-col slds-size_1-of-2">
                                    <div class="slds-form-element slds-form-element_readonly">
                                        <span class="slds-form-element__label">End Time</span>
                                        <div class="slds-form-element__control">
                                            <span class="slds-form-element__static">{selectedBooking.endDateTime}</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            
                            <div class="slds-form-element slds-form-element_readonly slds-m-bottom_small">
                                <span class="slds-form-element__label">Status</span>
                                <div class="slds-form-element__control">
                                    <lightning-badge 
                                        label={selectedBooking.status} 
                                        variant={selectedBooking.statusVariant}>
                                    </lightning-badge>
                                </div>
                            </div>
                            
                            <div class="slds-form-element slds-form-element_readonly slds-m-bottom_small">
                                <span class="slds-form-element__label">Purpose</span>
                                <div class="slds-form-element__control">
                                    <span class="slds-form-element__static">{selectedBooking.purpose}</span>
                                </div>
                            </div>
                            
                            <div class="slds-form-element slds-form-element_readonly slds-m-bottom_small">
                                <span class="slds-form-element__label">Booked By</span>
                                <div class="slds-form-element__control">
                                    <span class="slds-form-element__static">{selectedBooking.bookedBy}</span>
                                </div>
                            </div>
                            
                            <template if:true={selectedBooking.attendeeCount}>
                                <div class="slds-form-element slds-form-element_readonly slds-m-bottom_small">
                                    <span class="slds-form-element__label">Attendees</span>
                                    <div class="slds-form-element__control">
                                        <span class="slds-form-element__static">{selectedBooking.attendeeCount}</span>
                                    </div>
                                </div>
                            </template>
                            
                            <template if:true={selectedBooking.returnStatus}>
                                <div class="slds-form-element slds-form-element_readonly slds-m-bottom_small">
                                    <span class="slds-form-element__label">Return Status</span>
                                    <div class="slds-form-element__control">
                                        <span class="slds-form-element__static">{selectedBooking.returnStatus}</span>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </template>
                </div>
                <footer class="slds-modal__footer">
                    <lightning-button 
                        variant="neutral" 
                        label="Close" 
                        onclick={handleCloseModal}>
                    </lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
